<!-- Файл: assets/favicon.svg — значок сайта во вкладке браузера. SVG — векторный рисунок, описанный текстом (формат XML). Подключается тегом <link rel="icon"> на каждой странице. -->
<!-- <svg> — корневой тег рисунка; xmlns — обязательный «адрес» языка SVG; viewBox="0 0 64 64" — система координат 64 на 64 единицы -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- <defs> — раздел определений: здесь описываем то, что используем ниже (градиент) -->
  <defs>
    <!-- linearGradient — плавный переход цветов по прямой; id="g" — имя, по которому на него ссылаемся; x1,y1 → x2,y2 — направление по диагонали -->
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <!-- stop — точка градиента: offset="0" — начало, stop-color — индиго -->
      <stop offset="0" stop-color="#5754d6"/>
      <!-- offset="1" — конец градиента, коралловый цвет -->
      <stop offset="1" stop-color="#f0643f"/>
    <!-- закрываем градиент -->
    </linearGradient>
  <!-- закрываем раздел определений -->
  </defs>
  <!-- rect — прямоугольник на весь значок; rx="16" — скругление углов; fill="url(#g)" — заливка нашим градиентом -->
  <rect width="64" height="64" rx="16" fill="url(#g)"/>
  <!-- path — линия по точкам: M — «переместиться», L — «линия до»; это верхняя стрелка вправо; stroke — цвет линии, fill="none" — без заливки -->
  <path d="M16 24 H46 M38 16 L46 24 L38 32" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- нижняя стрелка влево; stroke-linecap="round" — круглые концы линий, stroke-linejoin="round" — скруглённые изгибы -->
  <path d="M48 40 H18 M26 32 L18 40 L26 48" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<!-- закрываем рисунок -->
</svg>
