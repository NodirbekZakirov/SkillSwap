<!-- ======================================================================== -->
<!-- Файл: pages/forgot-password.html — «Забыли пароль?».                     -->
<!-- Ученик вводит email, Supabase присылает письмо со ссылкой на             -->
<!-- pages/reset-password.html, где можно задать новый пароль.                -->
<!-- Связи: логика — js/pages/forgot-password.js.                             -->
<!-- ======================================================================== -->
<!-- тип документа -->
<!DOCTYPE html>
<!-- язык — русский -->
<html lang="ru">
<!-- служебная часть -->
<head>
  <!-- кодировка -->
  <meta charset="UTF-8">
  <!-- масштаб на телефоне -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- название вкладки -->
  <title>Восстановление пароля — SkillSwap</title>
  <!-- значок -->
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <!-- подключение к Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <!-- сервер шрифтов -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- шрифт Manrope -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap">
  <!-- переменные -->
  <link rel="stylesheet" href="/css/variables.css">
  <!-- базовые стили -->
  <link rel="stylesheet" href="/css/base.css">
  <!-- компоненты -->
  <link rel="stylesheet" href="/css/components.css">
  <!-- стили страниц -->
  <link rel="stylesheet" href="/css/pages.css">
  <!-- тема -->
  <script src="/js/theme-init.js"></script>
  <!-- скрипт страницы -->
  <script type="module" src="/js/pages/forgot-password.js"></script>
<!-- конец head -->
</head>
<!-- видимая часть -->
<body>
  <!-- шапка -->
  <header class="site-header" id="app-header"></header>
  <!-- основное содержимое -->
  <main class="page">
    <!-- контейнер -->
    <div class="container auth-page" id="page">
      <!-- карточка -->
      <div class="card auth-card">
        <!-- заголовок -->
        <h1>Забыли пароль?</h1>
        <!-- пояснение -->
        <p class="muted">Введи email, с которым регистрировался. Мы пришлём ссылку для нового пароля.</p>
        <!-- форма -->
        <form class="form" id="forgot-form" novalidate>
          <!-- поле email -->
          <div class="field">
            <!-- подпись -->
            <label for="email">Email</label>
            <!-- поле -->
            <input class="input" id="email" name="email" type="email" autocomplete="email" aria-describedby="email-error">
            <!-- ошибка -->
            <p class="field-error" id="email-error" hidden></p>
          <!-- конец поля -->
          </div>
          <!-- общая ошибка -->
          <div class="alert alert-error" data-form-error role="alert" hidden></div>
          <!-- кнопка -->
          <button class="btn btn-primary btn-block btn-lg" id="forgot-button" type="submit">Отправить ссылку</button>
        <!-- конец формы -->
        </form>
        <!-- сообщение об успехе (скрыто до отправки) -->
        <div class="alert alert-success" id="forgot-success" role="status" hidden>
          <!-- текст -->
          Если такой email зарегистрирован, письмо уже в пути. Проверь почту (и папку «Спам») и открой ссылку из письма.
        <!-- конец сообщения -->
        </div>
        <!-- ссылки -->
        <div class="auth-links">
          <!-- обратно ко входу -->
          <a href="/pages/login.html">← Вернуться ко входу</a>
        <!-- конец ссылок -->
        </div>
      <!-- конец карточки -->
      </div>
    <!-- конец контейнера -->
    </div>
  <!-- конец main -->
  </main>
<!-- конец body -->
</body>
<!-- конец html -->
</html>
