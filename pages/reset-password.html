<!-- ======================================================================== -->
<!-- Файл: pages/reset-password.html — ввод НОВОГО пароля.                    -->
<!-- Сюда ведёт ссылка из письма восстановления. В адресе ссылки есть         -->
<!-- временный ключ; supabase-js сам читает его и создаёт сессию, после       -->
<!-- чего можно сменить пароль.                                               -->
<!-- Связи: логика — js/pages/reset-password.js.                              -->
<!-- ======================================================================== -->
<!-- тип документа -->
<!DOCTYPE html>
<!-- язык — русский -->
<html lang="ru">
<!-- служебная часть -->
<head>
  <!-- кодировка -->
  <meta charset="UTF-8">
  <!-- масштаб на телефоне -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- название вкладки -->
  <title>Новый пароль — SkillSwap</title>
  <!-- значок -->
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <!-- подключение к Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <!-- сервер шрифтов -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- шрифт Manrope -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap">
  <!-- переменные -->
  <link rel="stylesheet" href="/css/variables.css">
  <!-- базовые стили -->
  <link rel="stylesheet" href="/css/base.css">
  <!-- компоненты -->
  <link rel="stylesheet" href="/css/components.css">
  <!-- стили страниц -->
  <link rel="stylesheet" href="/css/pages.css">
  <!-- тема -->
  <script src="/js/theme-init.js"></script>
  <!-- скрипт страницы -->
  <script type="module" src="/js/pages/reset-password.js"></script>
<!-- конец head -->
</head>
<!-- видимая часть -->
<body>
  <!-- шапка -->
  <header class="site-header" id="app-header"></header>
  <!-- основное содержимое -->
  <main class="page">
    <!-- контейнер -->
    <div class="container auth-page" id="page">
      <!-- карточка -->
      <div class="card auth-card">
        <!-- заголовок -->
        <h1>Новый пароль</h1>
        <!-- блок «ссылка недействительна» — покажет скрипт, если сессии восстановления нет -->
        <div class="alert alert-warning" id="reset-invalid" role="alert" hidden>
          <!-- текст -->
          Ссылка недействительна или устарела. <a href="/pages/forgot-password.html">Запроси новое письмо</a>.
        <!-- конец блока -->
        </div>
        <!-- форма (скрыта, пока не проверим ссылку) -->
        <form class="form" id="reset-form" novalidate hidden>
          <!-- поле нового пароля -->
          <div class="field">
            <!-- подпись -->
            <label for="password">Новый пароль</label>
            <!-- поле -->
            <input class="input" id="password" name="password" type="password" autocomplete="new-password" aria-describedby="password-error">
            <!-- ошибка -->
            <p class="field-error" id="password-error" hidden></p>
          <!-- конец поля -->
          </div>
          <!-- повтор -->
          <div class="field">
            <!-- подпись -->
            <label for="password-confirm">Повтори пароль</label>
            <!-- поле -->
            <input class="input" id="password-confirm" name="password_confirm" type="password" autocomplete="new-password" aria-describedby="password-confirm-error">
            <!-- ошибка -->
            <p class="field-error" id="password-confirm-error" hidden></p>
          <!-- конец поля -->
          </div>
          <!-- общая ошибка -->
          <div class="alert alert-error" data-form-error role="alert" hidden></div>
          <!-- кнопка -->
          <button class="btn btn-primary btn-block btn-lg" id="reset-button" type="submit">Сохранить пароль</button>
        <!-- конец формы -->
        </form>
        <!-- сообщение об успехе -->
        <div class="alert alert-success" id="reset-success" role="status" hidden>
          <!-- текст -->
          Пароль изменён! Сейчас откроем твою страницу…
        <!-- конец сообщения -->
        </div>
      <!-- конец карточки -->
      </div>
    <!-- конец контейнера -->
    </div>
  <!-- конец main -->
  </main>
<!-- конец body -->
</body>
<!-- конец html -->
</html>
